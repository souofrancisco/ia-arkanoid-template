[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-arkanoid"
version = "0.1.0"
authors = [
    { name = "Mário Antunes", email = "mario.antunes@ua.pt" }
]
description = "Arkanoid game implementation using AI Game Framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-game-framework>=1.2.0",
    "numpy>=2.0.0",
    "pygame>=2.5.0",
    "websockets>=16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "agents*", "viewer*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E402", "B027", "SIM108"]

[tool.basedpyright]
include = ["server", "agents", "viewer", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
failOnWarnings = false
venvPath = "."
venv = "venv"

[tool.vulture]
exclude = ["venv", ".venv"]
ignore_names = [
    "on_player_connect",
    "on_player_disconnect",
    "on_reset_sim",
    "on_start_sim",
    "on_stop_sim",
    "process_action",
    "tick",
    "get_state",
    "get_setup_payload",
    "deliberate",
    "run",
    "setUp",
    "tearDown",
    "setUpModule",
    "tearDownModule",
    "asyncSetUp",
    "asyncTearDown",
    "do_PUT",
    "log_message",
    "format",
]

[tool.coverage.run]
source = ["server", "agents"]
omit = [
    "tests/*",
    "agents/manual_agent.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
